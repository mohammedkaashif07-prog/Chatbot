[project]
name = "openai-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.3",
    "langgraph>=1.2.12",
    "openai>=3.22.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
]

[project.scripts]
openai-chatbot = "openai_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
